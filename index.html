<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Fourth Dimension - Dream World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0a0f;
            font-family: 'Courier New', monospace;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(5, 5, 15, 0.4) 100%);
        }

        #title {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(180, 160, 220, 0.6);
            font-size: 14px;
            letter-spacing: 8px;
            text-transform: uppercase;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(140, 100, 200, 0.5);
            animation: breathe 4s ease-in-out infinite;
        }

        #hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(140, 120, 180, 0.4);
            font-size: 11px;
            letter-spacing: 3px;
            pointer-events: none;
            animation: fade 6s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 0.9; }
        }

        @keyframes fade {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.15; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="overlay"></div>
    <div id="title">The Fourth Dimension</div>
    <div id="hint">move through the dream</div>

    <script>
        // Dream World Engine
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;
        let mouseX = 0.5;
        let mouseY = 0.5;
        let targetMouseX = 0.5;
        let targetMouseY = 0.5;
        let dreamPhase = 0;

        // Resize handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Mouse tracking
        document.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX / width;
            targetMouseY = e.clientY / height;
        });

        document.addEventListener('click', () => {
            dreamPhase += Math.PI * 0.5;
        });

        // Noise functions for organic movement
        function noise(x, y, z) {
            const X = Math.floor(x) & 255;
            const Y = Math.floor(y) & 255;
            const Z = Math.floor(z) & 255;
            x -= Math.floor(x);
            y -= Math.floor(y);
            z -= Math.floor(z);
            const u = fade(x);
            const v = fade(y);
            const w = fade(z);
            const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z;
            const B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
            return lerp(w, lerp(v, lerp(u, grad(p[AA], x, y, z), grad(p[BA], x - 1, y, z)),
                lerp(u, grad(p[AB], x, y - 1, z), grad(p[BB], x - 1, y - 1, z))),
                lerp(v, lerp(u, grad(p[AA + 1], x, y, z - 1), grad(p[BA + 1], x - 1, y, z - 1)),
                lerp(u, grad(p[AB + 1], x, y - 1, z - 1), grad(p[BB + 1], x - 1, y - 1, z - 1))));
        }

        function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
        function lerp(t, a, b) { return a + t * (b - a); }
        function grad(hash, x, y, z) {
            const h = hash & 15;
            const u = h < 8 ? x : y;
            const v = h < 4 ? y : h == 12 || h == 14 ? x : z;
            return ((h & 1) == 0 ? u : -u) + ((h & 2) == 0 ? v : -v);
        }

        // Permutation table
        const p = new Array(512);
        const permutation = [151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
        for (let i = 0; i < 256; i++) p[256 + i] = p[i] = permutation[i];

        // Fractal noise
        function fbm(x, y, z, octaves = 4) {
            let value = 0;
            let amplitude = 0.5;
            let frequency = 1;
            for (let i = 0; i < octaves; i++) {
                value += amplitude * noise(x * frequency, y * frequency, z * frequency);
                amplitude *= 0.5;
                frequency *= 2;
            }
            return value;
        }

        // Dream entities
        class FloatingForm {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.z = Math.random() * 1000;
                this.size = 20 + Math.random() * 80;
                this.type = Math.floor(Math.random() * 5);
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.02;
                this.pulsePhase = Math.random() * Math.PI * 2;
                this.hue = 220 + Math.random() * 80;
                this.opacity = 0.1 + Math.random() * 0.3;
            }

            update(dt) {
                const noiseVal = fbm(this.x * 0.001, this.y * 0.001, time * 0.1);
                this.x += Math.sin(noiseVal * Math.PI * 2 + this.pulsePhase) * 0.5;
                this.y += Math.cos(noiseVal * Math.PI * 2 + this.pulsePhase) * 0.3 - 0.2;
                this.z -= 1 + mouseY * 2;
                this.rotation += this.rotationSpeed;

                // Mouse influence
                const dx = (mouseX * width - this.x) * 0.001;
                const dy = (mouseY * height - this.y) * 0.001;
                this.x += dx * 2;
                this.y += dy * 2;

                if (this.z < 0 || this.y < -100 || this.y > height + 100) {
                    this.reset();
                    this.z = 800 + Math.random() * 200;
                    this.y = height + 50;
                }
            }

            draw() {
                const scale = 1000 / (1000 + this.z);
                const screenX = width / 2 + (this.x - width / 2) * scale;
                const screenY = height / 2 + (this.y - height / 2) * scale;
                const screenSize = this.size * scale;

                if (screenSize < 2) return;

                const pulse = Math.sin(time * 2 + this.pulsePhase) * 0.3 + 0.7;
                const alpha = this.opacity * scale * pulse;

                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(this.rotation + Math.sin(time + this.pulsePhase) * 0.2);

                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, screenSize);
                gradient.addColorStop(0, `hsla(${this.hue + Math.sin(time) * 20}, 60%, 70%, ${alpha})`);
                gradient.addColorStop(0.5, `hsla(${this.hue + 30}, 50%, 50%, ${alpha * 0.5})`);
                gradient.addColorStop(1, `hsla(${this.hue + 60}, 40%, 30%, 0)`);

                ctx.fillStyle = gradient;
                ctx.beginPath();

                // Different surreal shapes
                switch (this.type) {
                    case 0: // Morphing circle
                        for (let i = 0; i <= 32; i++) {
                            const angle = (i / 32) * Math.PI * 2;
                            const r = screenSize * (0.8 + fbm(Math.cos(angle), Math.sin(angle), time * 0.5 + this.pulsePhase) * 0.4);
                            const px = Math.cos(angle) * r;
                            const py = Math.sin(angle) * r;
                            if (i === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        }
                        break;
                    case 1: // Impossible triangle
                        const s = screenSize;
                        ctx.moveTo(0, -s);
                        ctx.lineTo(s * 0.866, s * 0.5);
                        ctx.lineTo(-s * 0.866, s * 0.5);
                        ctx.closePath();
                        ctx.moveTo(0, -s * 0.5);
                        ctx.lineTo(s * 0.433, s * 0.25);
                        ctx.lineTo(-s * 0.433, s * 0.25);
                        break;
                    case 2: // Eye
                        ctx.ellipse(0, 0, screenSize, screenSize * 0.5, 0, 0, Math.PI * 2);
                        ctx.moveTo(screenSize * 0.3, 0);
                        ctx.arc(0, 0, screenSize * 0.3, 0, Math.PI * 2);
                        break;
                    case 3: // Spiral
                        for (let i = 0; i <= 100; i++) {
                            const t = i / 100;
                            const angle = t * Math.PI * 6;
                            const r = t * screenSize;
                            const px = Math.cos(angle) * r;
                            const py = Math.sin(angle) * r;
                            if (i === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        }
                        ctx.lineWidth = 2 * scale;
                        ctx.strokeStyle = gradient;
                        ctx.stroke();
                        break;
                    case 4: // Tesseract projection
                        const ts = screenSize * 0.7;
                        const inner = ts * 0.5;
                        const phase = time * 0.5 + this.pulsePhase;
                        ctx.rect(-ts, -ts, ts * 2, ts * 2);
                        ctx.moveTo(-inner + Math.sin(phase) * 10, -inner + Math.cos(phase) * 10);
                        ctx.lineTo(inner + Math.sin(phase) * 10, -inner + Math.cos(phase) * 10);
                        ctx.lineTo(inner + Math.sin(phase) * 10, inner + Math.cos(phase) * 10);
                        ctx.lineTo(-inner + Math.sin(phase) * 10, inner + Math.cos(phase) * 10);
                        ctx.closePath();
                        break;
                }

                ctx.fill();
                ctx.restore();
            }
        }

        // Terrain layer for surreal landscape
        class DreamTerrain {
            constructor(y, speed, color, amplitude) {
                this.baseY = y;
                this.speed = speed;
                this.color = color;
                this.amplitude = amplitude;
                this.offset = Math.random() * 1000;
            }

            draw() {
                const points = [];
                const segments = 100;

                for (let i = 0; i <= segments; i++) {
                    const x = (i / segments) * width;
                    const noiseX = (x * 0.002 + this.offset + time * this.speed);
                    const noiseY = time * 0.1;
                    const y = this.baseY + fbm(noiseX, noiseY, dreamPhase * 0.1) * this.amplitude;

                    // Mouse influence creates waves
                    const distFromMouse = Math.abs(x - mouseX * width) / width;
                    const mouseWave = Math.sin(distFromMouse * Math.PI * 4 - time * 3) * 20 * (1 - distFromMouse) * mouseY;

                    points.push({ x, y: y + mouseWave });
                }

                ctx.beginPath();
                ctx.moveTo(0, height);
                points.forEach((p, i) => {
                    if (i === 0) ctx.lineTo(p.x, p.y);
                    else {
                        const prev = points[i - 1];
                        const cpx = (prev.x + p.x) / 2;
                        ctx.quadraticCurveTo(prev.x, prev.y, cpx, (prev.y + p.y) / 2);
                    }
                });
                ctx.lineTo(width, height);
                ctx.closePath();

                const gradient = ctx.createLinearGradient(0, this.baseY - this.amplitude, 0, height);
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(1, 'rgba(10, 5, 20, 0.9)');
                ctx.fillStyle = gradient;
                ctx.fill();
            }
        }

        // Particle system for mystical atmosphere
        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = 1 + Math.random() * 3;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5 - 0.3;
                this.life = 1;
                this.decay = 0.001 + Math.random() * 0.003;
                this.hue = 260 + Math.random() * 60;
            }

            update() {
                const noiseVal = fbm(this.x * 0.005, this.y * 0.005, time * 0.2);
                this.x += this.speedX + Math.sin(noiseVal * Math.PI * 2) * 0.5;
                this.y += this.speedY + Math.cos(noiseVal * Math.PI * 2) * 0.3;
                this.life -= this.decay;

                // Attracted to mouse
                const dx = mouseX * width - this.x;
                const dy = mouseY * height - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 200) {
                    this.x += dx * 0.002;
                    this.y += dy * 0.002;
                }

                if (this.life <= 0 || this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.reset();
                }
            }

            draw() {
                const alpha = this.life * 0.6;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 70%, 70%, ${alpha})`;
                ctx.fill();
            }
        }

        // Initialize entities
        const forms = [];
        for (let i = 0; i < 20; i++) {
            forms.push(new FloatingForm());
        }

        const terrains = [
            new DreamTerrain(height * 0.85, 0.02, 'rgba(20, 10, 40, 0.8)', 100),
            new DreamTerrain(height * 0.75, 0.03, 'rgba(40, 20, 60, 0.6)', 80),
            new DreamTerrain(height * 0.65, 0.04, 'rgba(60, 30, 80, 0.4)', 60),
        ];

        const particles = [];
        for (let i = 0; i < 150; i++) {
            particles.push(new Particle());
        }

        // Stars
        const stars = [];
        for (let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height * 0.6,
                size: Math.random() * 2,
                twinkle: Math.random() * Math.PI * 2
            });
        }

        // Main render loop
        let lastTime = 0;
        function animate(currentTime) {
            const dt = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            time += dt;

            // Smooth mouse following
            mouseX += (targetMouseX - mouseX) * 0.05;
            mouseY += (targetMouseY - mouseY) * 0.05;

            // Clear with fade effect for trails
            ctx.fillStyle = `rgba(8, 5, 15, 0.1)`;
            ctx.fillRect(0, 0, width, height);

            // Redraw background occasionally for full clear
            if (Math.random() < 0.02) {
                const bgGradient = ctx.createRadialGradient(
                    width * mouseX, height * mouseY, 0,
                    width / 2, height / 2, Math.max(width, height)
                );
                bgGradient.addColorStop(0, `hsla(${260 + Math.sin(time * 0.1) * 20}, 50%, 15%, 1)`);
                bgGradient.addColorStop(0.5, 'rgba(15, 10, 25, 1)');
                bgGradient.addColorStop(1, 'rgba(5, 3, 10, 1)');
                ctx.fillStyle = bgGradient;
                ctx.fillRect(0, 0, width, height);
            }

            // Draw stars
            stars.forEach(star => {
                const twinkle = Math.sin(time * 2 + star.twinkle) * 0.5 + 0.5;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size * twinkle, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200, 180, 255, ${0.3 + twinkle * 0.4})`;
                ctx.fill();
            });

            // Draw moon/portal
            const moonX = width * 0.7 + Math.sin(time * 0.1) * 50;
            const moonY = height * 0.25 + Math.cos(time * 0.15) * 30;
            const moonGradient = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, 80);
            moonGradient.addColorStop(0, 'rgba(200, 180, 255, 0.3)');
            moonGradient.addColorStop(0.5, 'rgba(140, 100, 200, 0.15)');
            moonGradient.addColorStop(1, 'rgba(80, 60, 120, 0)');
            ctx.beginPath();
            ctx.arc(moonX, moonY, 80, 0, Math.PI * 2);
            ctx.fillStyle = moonGradient;
            ctx.fill();

            // Inner portal effect
            const portalPhase = time * 0.5;
            for (let ring = 0; ring < 5; ring++) {
                ctx.beginPath();
                ctx.arc(moonX, moonY, 30 + ring * 10 + Math.sin(portalPhase + ring) * 5, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(180, 150, 255, ${0.2 - ring * 0.03})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Update and draw particles (behind terrain)
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // Draw floating forms (sorted by z for depth)
            forms.sort((a, b) => b.z - a.z);
            forms.forEach(form => {
                form.update(dt);
                form.draw();
            });

            // Draw terrain layers (front to back)
            terrains.forEach(terrain => terrain.draw());

            // Vignette fog effect
            const fogGradient = ctx.createRadialGradient(
                width / 2, height / 2, height * 0.3,
                width / 2, height / 2, height
            );
            fogGradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
            fogGradient.addColorStop(1, 'rgba(10, 5, 20, 0.6)');
            ctx.fillStyle = fogGradient;
            ctx.fillRect(0, 0, width, height);

            // Subtle scan lines for dreamy effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.03)';
            for (let y = 0; y < height; y += 4) {
                ctx.fillRect(0, y, width, 2);
            }

            requestAnimationFrame(animate);
        }

        // Start the dream
        animate(0);
    </script>
</body>
</html>
