<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f1f33"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="24" fill="url(#bgGrad)"/>

  <!-- Calculator/Estimate grid -->
  <rect x="30" y="40" width="132" height="112" rx="8" fill="#fff" opacity="0.95"/>

  <!-- Header bar -->
  <rect x="30" y="40" width="132" height="28" rx="8" fill="url(#accentGrad)"/>
  <rect x="30" y="60" width="132" height="8" fill="url(#accentGrad)"/>

  <!-- Dollar sign in header -->
  <text x="96" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f1f33" text-anchor="middle">$</text>

  <!-- Grid lines -->
  <line x1="30" y1="90" x2="162" y2="90" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="30" y1="110" x2="162" y2="110" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="30" y1="130" x2="162" y2="130" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="68" x2="90" y2="152" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="130" y1="68" x2="130" y2="152" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Data cells -->
  <rect x="35" y="75" width="50" height="10" rx="2" fill="#1e3a5f" opacity="0.2"/>
  <rect x="95" y="77" width="30" height="6" rx="1" fill="#1e3a5f" opacity="0.3"/>
  <rect x="135" y="77" width="22" height="6" rx="1" fill="#10b981"/>

  <rect x="35" y="95" width="50" height="10" rx="2" fill="#1e3a5f" opacity="0.2"/>
  <rect x="95" y="97" width="30" height="6" rx="1" fill="#1e3a5f" opacity="0.3"/>
  <rect x="135" y="97" width="22" height="6" rx="1" fill="#10b981"/>

  <rect x="35" y="115" width="50" height="10" rx="2" fill="#1e3a5f" opacity="0.2"/>
  <rect x="95" y="117" width="30" height="6" rx="1" fill="#1e3a5f" opacity="0.3"/>
  <rect x="135" y="117" width="22" height="6" rx="1" fill="#10b981"/>

  <!-- Total row -->
  <rect x="35" y="135" width="50" height="10" rx="2" fill="#1e3a5f" opacity="0.4"/>
  <rect x="135" y="135" width="22" height="10" rx="2" fill="url(#accentGrad)"/>

  <!-- AI Check badge -->
  <circle cx="152" cy="50" r="16" fill="#10b981"/>
  <text x="152" y="55" font-family="Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle">AI</text>
</svg>
